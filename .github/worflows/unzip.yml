name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q VolumenTecno.zip
          rm -rf VolumenTecno/.github
          cp -a VolumenTecno/. .
          rm -rf VolumenTecno VolumenTecno.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Descomprimir proyecto"
          git push
