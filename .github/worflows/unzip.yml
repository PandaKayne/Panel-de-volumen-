name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        id: b
        run: |
          if [ -f VolumenTecno.zip ]; then
            rm -rf _proyecto
            unzip -q VolumenTecno.zip -d _proyecto
            cd _proyecto/VolumenTecno
          fi
          echo "ver=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)" >> $GITHUB_OUTPUT
          gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VolumenVirtual-v${{ steps.b.outputs.ver }}
          path: "**/build/outputs/apk/release/*.apk"
