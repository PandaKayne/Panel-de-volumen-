name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Preparar proyecto
        run: |
          if [ -f VolumenTecno.zip ]; then unzip -q VolumenTecno.zip -d _proyecto; fi
      - name: Compilar
        run: |
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then
            echo "No se encontro settings.gradle.kts. Archivos del repo:"
            ls -R | head -60
            exit 1
          fi
          echo "Proyecto en: $S"
          cd "$(dirname "$S")"
          gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VolumenTecno
          path: "**/build/outputs/apk/release/*.apk"
